name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run biome
      - run: bun run test
      - run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_CI }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login

  # Shared JS core (plan 023 N1d/N0d). macOS because the parity spike loads the
  # bundle into a real JavaScriptCore JSContext; `macos-26` is the GA arm64
  # runner and matches the toolchain the Apple apps are built with.
  core-js:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run core:build
      - run: bun run core:parity

  # Design-token cascade check (follow-up F1). Needs a browser: the bug it
  # guards against is only visible once a CSS engine has resolved the cascade,
  # and the blocking `ci` job above deliberately stays browser-free. Compiles
  # app/globals.css with the app's own PostCSS pipeline, so it does not depend
  # on `next build`.
  design-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run tokens:cascade

  # RectoEditor (plan 023 N5). `macos-26` is arm64 with Xcode 26.6 (17F113)
  # as the default toolchain — the macOS 26 SDK and Swift 6.3 the package needs
  # (`swift-tools-version: 6.2`, `.defaultIsolation(MainActor.self)`,
  # `platforms: [.macOS(.v26)]`). `macos-latest` is the same image today, but
  # pinning keeps a future -latest bump from silently changing the SDK.
  #
  # Blocking: it builds and runs unit tests only. The perf suite is opt-in
  # (RECTO_RUN_PERF) because wall-clock thresholds on a shared runner are
  # flaky enough to teach people to ignore red.
  editor:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: swift --version
      - name: Build
        working-directory: apple/Packages/RectoEditor
        run: swift build
      - name: Test
        working-directory: apple/Packages/RectoEditor
        run: swift test

  # Browser smoke suite (plan 021). Non-blocking (continue-on-error) for the
  # first iteration — flip it to blocking once it has been stable ~2 weeks.
  #
  # Required repo secrets (NAMES only — values are the operator's to set; use
  # dev-instance/test keys only, never production):
  #   CLERK_PUBLISHABLE_KEY_CI   pk_test_… (shared with the build step above)
  #   CLERK_SECRET_KEY_CI        sk_test_… dev-instance secret key
  #                              (@clerk/testing mints Testing Tokens with it,
  #                              and e2e/global-setup.ts creates/signs in the
  #                              dedicated e2e user)
  #   CONVEX_DEPLOY_KEY_CI       a dev deploy key so `convex dev` (inside
  #                              `bun run dev`, Playwright's webServer) can
  #                              authenticate headlessly and push functions
  #   CONVEX_URL_CI              https://<deployment>.convex.cloud
  #   CONVEX_SITE_URL_CI         https://<deployment>.convex.site
  #   OPENROUTER_API_KEY_CI      optional — without it the AI accept/reject
  #                              spec self-skips (documented skip)
  #
  # CAUTION: the deployment CONVEX_DEPLOY_KEY_CI points at is NOT isolated
  # per-run. Specs write real rows there (scoped to the dedicated e2e user,
  # titles prefixed "e2e-", deleted by the tests on success). Point it at a
  # dedicated CI dev deployment — not at a personal dev deployment and never
  # at prod.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_CI }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_CI }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_CI }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_URL_CI }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL_CI }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_CI }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
