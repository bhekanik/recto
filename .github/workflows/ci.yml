name: CI

# The Bun version is pinned, and it must match `ci_scripts/ci_post_clone.sh`.
# The bundles CI tests and the bundles Xcode Cloud ships are produced by
# whichever Bun built them, so a floating `latest` here means the tested
# artefact and the shipped artefact can come from different bundlers.
# `apple/scripts/copy-js-bundles.sh` checks the bytes, not the toolchain.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run biome
      - run: bun run test
      # Bun-side halves of the two JS cores. The macOS job runs the same
      # fixtures through a real JSContext; a case that passes here and fails
      # there is a bridge bug, not a vim or markdown bug.
      - run: bun run core:build
      - run: bun run vim:build
      - run: bun run vim:test
      - run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_CI }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login

  # Shared JS cores and their Swift wrappers (plan 023 N1d/N0d, N3).
  #
  # macOS because everything here is about a real JavaScriptCore `JSContext`:
  # the parity runner, the vim keystroke suite in JSC, and the two Swift
  # packages. `macos-26` is the GA arm64 runner and matches the toolchain the
  # Apple apps are built with.
  #
  # `swift test` needs the bundles installed into the package resources, which
  # is what the copy script does — and it is the same script the Xcode run-script
  # phase and `ci_scripts/ci_post_clone.sh` run, so a hash or bundle-scan
  # regression fails here first.
  core-js:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run core:build
      - run: bun run vim:build
      - run: bun run core:parity
      - run: bun run vim:test
      # Runs the bundle build, the manifest check and the secret scan — the
      # same script Xcode and Xcode Cloud run.
      - run: ./apple/scripts/copy-js-bundles.sh
      # And proves the scanner still matches what it claims to.
      - run: ./apple/scripts/scan-samples.sh
      - run: swift test --package-path apple/Packages/RectoCoreJS
      - run: swift test --package-path apple/Packages/RectoVim
      # The device perf spike is not run here — its numbers depend on the
      # signing of the process — but it must keep compiling, for macOS and for
      # iOS. It stopped compiling once and nothing noticed until a review.
      - run: swift build --package-path apple/Spikes/JSCPerf
      - run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme JSCPerf \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            | tail -20
        working-directory: apple/Spikes/JSCPerf
      # The UIKit adapter is `#if canImport(UIKit)` and never compiles on the
      # macOS test run, so build it for the simulator to keep it honest.
      - name: build RectoVim for iOS (compile-checks the UIKit adapter)
        # `set -o pipefail` or the pipe would hand the step `tail`'s exit status
        # and a failing build would pass.
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme RectoVim \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            | tail -20
        working-directory: apple/Packages/RectoVim

  # Design-token cascade check (follow-up F1). Needs a browser: the bug it
  # guards against is only visible once a CSS engine has resolved the cascade,
  # and the blocking `ci` job above deliberately stays browser-free. Compiles
  # app/globals.css with the app's own PostCSS pipeline, so it does not depend
  # on `next build`.
  design-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run tokens:cascade

  # RectoEditor (plan 023 N5). `macos-26` is arm64 with Xcode 26.6 (17F113)
  # as the default toolchain — the macOS 26 SDK and Swift 6.3 the package needs
  # (`swift-tools-version: 6.2`, `.defaultIsolation(MainActor.self)`,
  # `platforms: [.macOS(.v26)]`). `macos-latest` is the same image today, but
  # pinning keeps a future -latest bump from silently changing the SDK.
  #
  # Blocking: it builds and runs unit tests only. The perf suite is opt-in
  # (RECTO_RUN_PERF) because wall-clock thresholds on a shared runner are
  # flaky enough to teach people to ignore red.
  editor:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: swift --version
      # Warnings are failures. The engine's soundness argument is that its
      # mutable static caches are main-actor isolated, and every actor-isolation
      # warning is that argument leaking. `unsafeFlags` cannot carry
      # -warnings-as-errors (SwiftPM refuses them in a package consumed as a
      # dependency), so the gate lives here. The dependency is compiled from
      # source, so this covers the fork too.
      - name: Build (warnings are failures)
        working-directory: apple/Packages/RectoEditor
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::Swift emitted warnings; see below."
            grep 'warning:' build.log | sort -u | head -40
            exit 1
          fi
      # Three times: the suite mounts real AppKit windows, and window-backed
      # tests are where flakiness hides. A run that only passes sometimes must
      # fail here rather than in someone's afternoon.
      - name: Test
        working-directory: apple/Packages/RectoEditor
        run: for i in 1 2 3; do swift test || exit 1; done

  # The shipping macOS document app. Package-only coverage cannot catch a
  # dropped app test target or a broken FileDocument host.
  recto-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Debug tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project apple/RectoApp/Recto.xcodeproj \
            -scheme Recto \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/recto-debug" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -40
      - name: Release archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project apple/RectoApp/Recto.xcodeproj \
            -scheme Recto \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/recto-release" \
            -archivePath "$RUNNER_TEMP/Recto.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            RECTO_CONVEX_URL='https://example.convex.cloud' \
            RECTO_CLERK_PUBLISHABLE_KEY='pk_test_bW9jay5jbGVyay5hY2NvdW50cy5kZXYk' \
            RECTO_WEB_URL='https://example.test' \
            2>&1 | tee "$RUNNER_TEMP/recto-archive.log"
          if grep -q "built for newer 'macOS' version" "$RUNNER_TEMP/recto-archive.log"; then
            echo "::error::A linked object requires a newer macOS deployment target."
            exit 1
          fi
          apple/RectoApp/scripts/validate-archive-config.sh "$RUNNER_TEMP/Recto.xcarchive"
          lipo \
            "$RUNNER_TEMP/Recto.xcarchive/Products/Applications/Recto.app/Contents/MacOS/Recto" \
            -verify_arch arm64

  # Swift packages under apple/Packages (plan 023 N4). Hermetic: the live Convex
  # tests in RectoIntegrationTests skip themselves unless RECTO_CONVEX_URL and
  # RECTO_CLERK_PUBLISHABLE_KEY are set, and CI deliberately does not set them —
  # the shared dev deployment is not isolated per run.
  #
  # Needs the macOS 26 SDK. Convex's binary requires macOS 26.2.
  apple-core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: bun install --frozen-lockfile
      # The Swift history ports must agree with lib/ byte-for-byte. Regenerating
      # the fixtures from the web implementations and diffing catches stale
      # fixture expectations after a web implementation changes.
      - name: History fixtures are current
        run: |
          bun run apple/tools/generate-history-fixtures.ts
          git diff --exit-code apple/Packages/RectoHistory/Tests/RectoHistoryTests/Fixtures
      - name: swift test
        run: |
          set -euo pipefail
          for package in RectoHistory RectoStore RectoAuth RectoSync RectoCore; do
            echo "::group::$package"
            swift test --package-path "apple/Packages/$package"
            echo "::endgroup::"
          done

  # Browser smoke suite (plan 021). Non-blocking (continue-on-error) for the
  # first iteration — flip it to blocking once it has been stable ~2 weeks.
  #
  # Required repo secrets (NAMES only — values are the operator's to set; use
  # dev-instance/test keys only, never production):
  #   CLERK_PUBLISHABLE_KEY_CI   pk_test_… (shared with the build step above)
  #   CLERK_SECRET_KEY_CI        sk_test_… dev-instance secret key
  #                              (@clerk/testing mints Testing Tokens with it,
  #                              and e2e/global-setup.ts creates/signs in the
  #                              dedicated e2e user)
  #   CONVEX_DEPLOY_KEY_CI       a dev deploy key so `convex dev` (inside
  #                              `bun run dev`, Playwright's webServer) can
  #                              authenticate headlessly and push functions
  #   CONVEX_URL_CI              https://<deployment>.convex.cloud
  #   CONVEX_SITE_URL_CI         https://<deployment>.convex.site
  #   OPENROUTER_API_KEY_CI      optional — without it the AI accept/reject
  #                              spec self-skips (documented skip)
  #
  # CAUTION: the deployment CONVEX_DEPLOY_KEY_CI points at is NOT isolated
  # per-run. Specs write real rows there (scoped to the dedicated e2e user,
  # titles prefixed "e2e-", deleted by the tests on success). Point it at a
  # dedicated CI dev deployment — not at a personal dev deployment and never
  # at prod.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_CI }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_CI }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_CI }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_URL_CI }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL_CI }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_CI }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
