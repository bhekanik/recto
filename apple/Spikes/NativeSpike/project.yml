name: NativeSpike
options:
  bundleIdPrefix: com.bhekani.recto.spike
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  ClerkKit:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.5.0
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.1

settings:
  base:
    # convex-swift's xcframework ships arm64 slices only (ios-arm64,
    # ios-arm64-simulator, macos-arm64). Building "Any Mac" pulls in x86_64 and
    # fails to link (convex-swift#10); plan 023 D-N9 is arm64-only anyway.
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64
    DEVELOPMENT_TEAM: WAVMJLFY95
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  NativeSpike:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: ClerkKit
        product: ClerkKit
      - package: ConvexMobile
        product: ConvexMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhekani.recto.spike.native
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/NativeSpike.macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The bare Info.plist has no icon or launch storyboard; the spike is
        # about the network stack, not the shell.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Only the macOS build is sandboxed; iOS gets the keychain group Clerk
        # needs. The simulator build must still be signed (ad hoc) — an
        # unsigned one traps in Clerk.configure with keychain OSStatus -34018.
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Resources/NativeSpike.iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Resources/NativeSpike.iOS.entitlements
