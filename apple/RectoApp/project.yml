name: Recto
options:
  bundleIdPrefix: com.bhekani
  deploymentTarget:
    macOS: "26.2"
  createIntermediateGroups: true
  groupSortPosition: top

fileGroups:
  - Brand

packages:
  RectoAuth:
    path: ../Packages/RectoAuth
  RectoCore:
    path: ../Packages/RectoCore
  RectoCoreJS:
    path: ../Packages/RectoCoreJS
  RectoEditor:
    path: ../Packages/RectoEditor
  RectoHistory:
    path: ../Packages/RectoHistory
  RectoStore:
    path: ../Packages/RectoStore
  RectoSync:
    path: ../Packages/RectoSync

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: WAVMJLFY95

targets:
  Recto:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: RectoAuth
      - package: RectoCore
      - package: RectoCoreJS
      - package: RectoEditor
      - package: RectoHistory
      - package: RectoStore
      - package: RectoSync
    entitlements:
      path: Support/Recto.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Recto
        CFBundleName: Recto
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Bhekani Khumalo"
        RectoClerkPublishableKey: "$(RECTO_CLERK_PUBLISHABLE_KEY)"
        RectoConvexURL: "$(RECTO_CONVEX_URL)"
        RectoWebURL: "$(RECTO_WEB_URL)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Recto document link
            CFBundleURLSchemes:
              - recto
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.utf8-plain-text
            UTTypeDescription: Markdown document
            UTTypeIdentifier: net.daringfireball.markdown
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
              public.mime-type: text/markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhekani.recto
        # Twilight's accent in dark, Paper's in light: system controls
        # (focus rings, toggles, buttons) follow Recto instead of blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

  RectoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Recto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhekani.recto.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Recto.app/Contents/MacOS/Recto"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

schemes:
  Recto:
    build:
      targets:
        Recto: all
        RectoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RectoTests
    archive:
      config: Release
